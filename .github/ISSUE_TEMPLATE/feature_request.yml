name: ✨ 功能请求 / Feature request
description: 新能力或现有能力的改进 / Propose a new capability or improvement
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        先写**你想解决的问题**，再写你设想的方案。多数好设计来自前者，后者常常会被改掉。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么 / The problem
      description: 现在没有它的时候你怎么绕行？绕行成本多大？
      placeholder: 每次导出都要手动改三个路径，一周大概浪费 20 分钟。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的行为 / Desired solution
      description: 从使用者视角描述，尽量不锁定实现方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives
      description: 也包括"就这样不做"的代价
  - type: dropdown
    id: scope
    attributes:
      label: 需要改动的范围 / Blast radius
      options:
        - 只改本仓库代码
        - 需要数据迁移
        - 会改变对外接口（CLI 参数 / API / 配置项）
        - 会影响已有用户的使用习惯
  - type: textarea
    id: contribution
    attributes:
      label: 你打算自己动手吗 / Are you going to implement it?
      placeholder: 愿意做但需要先聊聊设计 / 只是想提出来 / 可以接 PR，模块在哪不清楚
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前自检
      options:
        - label: 已确认这不是重复请求
          required: true
        - label: 我理解"好的设计常常不等于最初设想的方案"
          required: false
